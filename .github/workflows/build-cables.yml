name: Build VB-Cable prototype

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-prototype:
    name: Build Windows prototype
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore VBCableAlternative.sln /p:EnableWindowsTargeting=true

      - name: Publish prototype for Windows
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish/win-x64"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          dotnet publish VBCableAlternative.App/VBCableAlternative.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output $publishDir `
            /p:EnableWindowsTargeting=true

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "VirtualCable-Prototype-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -Force

          Get-ChildItem $publishDir | Select-Object FullName
          Write-Host "ZIP=$zipPath"

      - name: Upload single prototype artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-cable-prototype-win-x64
          path: VirtualCable-Prototype-win-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-prototype
    runs-on: ubuntu-latest

    steps:
      - name: Download prototype artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/virtual-cable-prototype-win-x64/VirtualCable-Prototype-win-x64.zip
          overwrite_files: true
          generate_release_notes: true
          make_latest: true
