name: Build VB-Cable variants

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-cables:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        cable: [A, B, C, D]

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore VBCableAlternative.sln /p:EnableWindowsTargeting=true

      - name: Publish cable ${{ matrix.cable }} for Windows
        shell: pwsh
        run: |
          $publishDir = Join-Path $env:GITHUB_WORKSPACE "publish/cable-${{ matrix.cable }}"
          New-Item -ItemType Directory -Path $publishDir -Force | Out-Null

          dotnet publish VBCableAlternative.App/VBCableAlternative.App.csproj `
            --configuration Release `
            --runtime win-x64 `
            --self-contained false `
            --output $publishDir `
            /p:EnableWindowsTargeting=true

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "VirtualCable-Cable-${{ matrix.cable }}-win-x64.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path (Join-Path $publishDir '*') -DestinationPath $zipPath -Force

          Get-ChildItem $publishDir | Select-Object FullName
          Write-Host "ZIP=$zipPath"

      - name: Upload cable ${{ matrix.cable }} artifact
        uses: actions/upload-artifact@v4
        with:
          name: cable-${{ matrix.cable }}-win-x64
          path: VirtualCable-Cable-${{ matrix.cable }}-win-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-cables
    runs-on: ubuntu-latest

    steps:
      - name: Download all cable artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/cable-A-win-x64/VirtualCable-Cable-A-win-x64.zip
            release-assets/cable-B-win-x64/VirtualCable-Cable-B-win-x64.zip
            release-assets/cable-C-win-x64/VirtualCable-Cable-C-win-x64.zip
            release-assets/cable-D-win-x64/VirtualCable-Cable-D-win-x64.zip
          generate_release_notes: true
