name: Build VB-CABLE driver

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-driver:
    name: Build and package test-signed x64 driver
    runs-on: windows-2022

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Run catalog tests
        run: dotnet test VBCableAlternative.sln /p:EnableWindowsTargeting=true --nologo

      - name: Validate installer script
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "drivers/Install-Cable.ps1",
            [ref]$tokens,
            [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; throw "Installer script syntax is invalid." }

      - name: Build SysVAD driver package
        shell: pwsh
        run: |
          $solution = Join-Path $env:GITHUB_WORKSPACE "drivers/windows-driver-samples/audio/sysvad/sysvad.sln"
          msbuild $solution /m /t:Build /p:Configuration=Release /p:Platform=x64 /p:SignMode=Off /v:minimal
          if ($LASTEXITCODE -ne 0) { throw "SysVAD driver build failed." }

          $catalog = Get-ChildItem (Split-Path $solution) -Recurse -Filter sysvad.cat |
            Where-Object { $_.FullName -match '[\\/]package[\\/]' } |
            Select-Object -First 1
          if (-not $catalog) { throw "The WDK build did not produce sysvad.cat in a package directory." }

          $packageDir = $catalog.DirectoryName
          foreach ($requiredFile in @("TabletAudioSample.sys", "ComponentizedAudioSample.inf", "sysvad.cat")) {
            if (-not (Test-Path (Join-Path $packageDir $requiredFile))) { throw "Driver package is missing $requiredFile." }
          }
          $infText = Get-Content (Join-Path $packageDir "ComponentizedAudioSample.inf") -Raw
          foreach ($endpointName in @(
            "CABLE-A Input", "CABLE-A Output", "CABLE-B Input", "CABLE-B Output",
            "CABLE-C Input", "CABLE-C Output", "CABLE-D Input", "CABLE-D Output")) {
            if (-not $infText.Contains($endpointName)) { throw "Generated INF is missing endpoint $endpointName." }
          }

          $stageDir = Join-Path $env:GITHUB_WORKSPACE "artifacts/VirtualCable-Driver-TestSigned-win-x64"
          New-Item -ItemType Directory -Path $stageDir -Force | Out-Null
          Get-ChildItem $packageDir -Force | Copy-Item -Destination $stageDir -Recurse -Force

          $certificate = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject "CN=VirtualCable Local Test Signing" `
            -CertStoreLocation "Cert:\CurrentUser\My"
          $certificatePath = Join-Path $stageDir "VirtualCable-TestCertificate.cer"
          Export-Certificate -Cert $certificate -FilePath $certificatePath | Out-Null

          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) { throw "Windows SDK signtool.exe was not found." }
          $stagedCatalog = Join-Path $stageDir "sysvad.cat"
          if (-not (Test-Path $stagedCatalog)) { throw "sysvad.cat was not copied into the package stage." }
          & $signtool.FullName sign /v /fd SHA256 /s My /sha1 $certificate.Thumbprint $stagedCatalog
          if ($LASTEXITCODE -ne 0) { throw "Test-signing the driver catalog failed." }

          Copy-Item "drivers/Install-Cable.ps1" $stageDir
          Copy-Item "drivers/README.md" $stageDir
          Copy-Item "drivers/windows-driver-samples/LICENSE" $stageDir
          Copy-Item "drivers/windows-driver-samples/wil/LICENSE" (Join-Path $stageDir "WIL-LICENSE")

          $zipPath = Join-Path $env:GITHUB_WORKSPACE "VirtualCable-Driver-TestSigned-win-x64.zip"
          Compress-Archive -Path (Join-Path $stageDir '*') -DestinationPath $zipPath -Force
          Write-Host "Driver package: $packageDir"
          Write-Host "ZIP: $zipPath"

      - name: Upload single test driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: virtual-cable-driver-test-signed-win-x64
          path: VirtualCable-Driver-TestSigned-win-x64.zip
          if-no-files-found: error

  release:
    name: Publish GitHub release assets
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-driver
    runs-on: ubuntu-latest

    steps:
      - name: Download driver artifact
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/virtual-cable-driver-test-signed-win-x64/VirtualCable-Driver-TestSigned-win-x64.zip
          overwrite_files: true
          generate_release_notes: true
          prerelease: true
          make_latest: false
